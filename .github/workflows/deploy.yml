name: Deploy Eixo-Catálogo (SPA Estático) para Hospedagem Compartilhada

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: 🏗️ Build SPA Estático & 🚀 Deploy (FTP)
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Obter código mais recente
        uses: actions/checkout@v4

      - name: 🟢 Instalar Node.js 22 (LTS — requerido por Vite 8 + TanStack Start)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Instalar dependências (esbuild incluído — Tailwind Vite 4.2+)
        run: npm ci

      - name: 🛠️ Build SPA Client-Side (Vite config dedicado)
        env:
          # Secrets injetados no ambiente do step (process.env). loadEnv do Vite
          # lê VARs deste ambiente quando envPrefix=["VITE_"] + substitui em
          # import.meta.env.VITE_* no build. $GITHUB_ENV vale para os PRÓXIMOS
          # steps (não o mesmo shell), por isso mantemos aqui também.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set +e  # sanity check não pode quebrar o step
          echo "--- 1) Variáveis no shell do step ---"
          [ -n "$VITE_SUPABASE_URL" ]            && echo "✅ VITE_SUPABASE_URL            (shell) : len=${#VITE_SUPABASE_URL} prefix=${VITE_SUPABASE_URL:0:18}…${VITE_SUPABASE_URL:(-4)}" || echo "❌ VITE_SUPABASE_URL            (shell) : VAZIA"
          [ -n "$VITE_SUPABASE_PUBLISHABLE_KEY" ] && echo "✅ VITE_SUPABASE_PUBLISHABLE_KEY (shell) : len=${#VITE_SUPABASE_PUBLISHABLE_KEY} prefix=${VITE_SUPABASE_PUBLISHABLE_KEY:0:12}…${VITE_SUPABASE_PUBLISHABLE_KEY:(-4)}" || echo "❌ VITE_SUPABASE_PUBLISHABLE_KEY (shell) : VAZIA"
          echo
          echo "--- 2) Escreve em \$GITHUB_ENV para steps posteriores ---"
          # Passo defensivo: apesar de termos `env:` neste step, garantimos que
          # os próximos steps também enxerguem (ex: debug final).
          {
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}"
          } >> "$GITHUB_ENV"
          echo
          echo "--- 3) Build Vite (vite.static.config.ts, outDir=dist) ---"
          # 🔑 CRÍTICO: usar `env VAR=... npm run X` GARANTE que variáveis entram
          #    no `process.env` do processo filho do Vite (não depende de shell
          #    export ou GITHUB_ENV). Método mais seguro para runners Ubuntu.
          VITE_SUPABASE_URL="${VITE_SUPABASE_URL}" \
          VITE_SUPABASE_PUBLISHABLE_KEY="${VITE_SUPABASE_PUBLISHABLE_KEY}" \
            npm run build:static
          BUILD_RC=$?
          echo
          if [ "$BUILD_RC" -ne 0 ]; then
            echo "❌ npm run build:static FALHOU (exit=$BUILD_RC). Veja logs acima."
            exit $BUILD_RC
          fi
          echo "--- 4) Sanity check pós-build — vars inliner no bundle? ---"
          INDEX_JS=$(ls dist/assets/index-*.js 2>/dev/null | head -n 1)
          if [ -n "$INDEX_JS" ]; then
            HIT=$(grep -c "aynepdnkrjlrdmskduoq" "$INDEX_JS" 2>/dev/null || echo 0)
            [ "$HIT" -gt 0 ] && echo "✅ SUPABASE_PROJECT_ID (aynepdnkrjlrdmskduoq) encontrado no bundle (vars embutidas OK)" \
                            || echo "⚠️  SUPABASE_PROJECT_ID NÃO encontrado no bundle — login provavelmente vai dar 'Missing Supabase environment variable(s)'"
          else
            echo "❌ Nenhum index-*.js em dist/assets/. Build inválido."
            exit 2
          fi

      - name: 🧾 Listar arquivos de saída e validar .htaccess + index.html
        run: |
          echo "--- Arquivos em dist (primeiro nível): ---"
          ls -la dist/
          echo
          echo "--- Existem arquivos obrigatórios? ---"
          test -f dist/index.html   && echo "✅ index.html (entry SPA)"     || echo "❌ index.html NÃO encontrado"
          test -f dist/.htaccess    && echo "✅ .htaccess (Apache rewrite)" || echo "❌ .htaccess NÃO encontrado"
          test -f dist/favicon.png  && echo "✅ favicon.png (brand logo)"   || echo "❌ favicon.png NÃO encontrado"
          echo
          echo "--- assets/ (CSS/JS entry): ---"
          ls -la dist/assets/styles-* 2>/dev/null || true
          ls -la dist/assets/index-*  2>/dev/null || true
          echo
          echo "--- Tamanho total dist/: ---"
          du -sh dist 2>/dev/null || true

      - name: 📂 Sincronizar arquivos estáticos via FTP (hospedagem cPanel/Apache)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ./catalogo.eixoconsorcios.com.br/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/src/**
            **/supabase/**
            **/scripts/**
            .env
            .env.*
          dangerous-clean-slate: false

      - name: ✅ Deploy concluído
        run: |
          echo "======================================================================"
          echo "✅  Build e deploy finalizados com sucesso!"
          echo "======================================================================"
          echo " Servidor FTP    : ${{ secrets.FTP_SERVER }}"
          echo " Path (server)   : ./catalogo.eixoconsorcios.com.br/"
          echo " URL pública (HTTPS) :"
          echo "  https://catalogo.eixoconsorcios.com.br"
          echo "======================================================================"
          echo " Em caso de erro 404 ao fazer F5 em rotas como /admin/maquinas,"
          echo " confirme no Apache do servidor que .htaccess (rewrite base /) está"
          echo " autorizado (AllowOverride All ou FileInfo)."
          echo "======================================================================"
